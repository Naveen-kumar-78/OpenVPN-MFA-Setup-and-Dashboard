<!DOCTYPE html>
<html lang="en" data-theme="{{ current_theme or 'dark' }}" data-bs-theme="{{ current_theme or 'dark' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ error }} - Zubby VPN</title>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('zubby_theme') || '{{ current_theme or "dark" }}';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root, [data-theme="dark"], [data-bs-theme="dark"] {
      --bg-body: #0b132b;
      --bg-sidebar: #111827;
      --bg-card: #1c2541;
      --bg-card-header: #151d36;
      --bg-input: #0f172a;
      --bg-table-header: #0f172a;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"], [data-bs-theme="light"] {
      --bg-body: #f1f5f9;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-card-header: #f8fafc;
      --bg-input: #ffffff;
      --bg-table-header: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      color: var(--text-main);
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="card p-5 text-center shadow" style="max-width: 480px; width: 90%;">
  <i class="fas fa-triangle-exclamation fa-4x text-warning mb-3"></i>
  <h3 class="fw-bold mb-2">{{ error }}</h3>
  <p class="text-muted mb-4">{{ message }}</p>
  <div>
    <a href="/" class="btn btn-sm btn-primary rounded-pill px-4 py-2 fw-semibold">
      <i class="fas fa-house me-1"></i> Back to Dashboard
    </a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function applyTheme(theme) {
  if (!theme) theme = 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-bs-theme', theme);
  localStorage.setItem('zubby_theme', theme);
  document.cookie = "zubby_theme=" + theme + "; path=/; max-age=31536000; SameSite=Lax";
}

document.addEventListener('DOMContentLoaded', function() {
  const saved = localStorage.getItem('zubby_theme') || 'dark';
  applyTheme(saved);
});
</script>
</body>
</html>
